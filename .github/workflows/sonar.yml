name: SonarQube Analysis

# El pipeline se ejecutará cada vez que hagas un push o un Pull Request a la rama main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  sonar:
    name: Build and Analyze
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga el código del repositorio en la máquina virtual de GitHub
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Crucial para que Sonar pueda ver el historial de Git y quién hizo cada cambio

      # 2. Configura el entorno de Java 21 que instalamos previamente
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven' # Guarda en caché las librerías de Maven para que el pipeline vaya más rápido

      # 3. Compila con Maven y ejecuta el análisis de Sonar
      - name: Build and analyze with Sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "https://sonarcloud.io"
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=Alexalmg_task-api \
            -Dsonar.organization=alexalmg